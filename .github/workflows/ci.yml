name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Regeln und Build pruefen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: Code pruefen
        run: npm run lint

      - name: Regelengine testen
        run: npm test

      - name: Statische App bauen
        run: npm run build
